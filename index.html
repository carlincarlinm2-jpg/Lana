<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="north-version" content="3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="North">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap">
<title>North — Mis finanzas</title>
<style>
:root{--bg:#131416;--bg2:#17181b;--card:#1c1d20;--card2:#25262a;--line:#2e2f34;--ink:#ededee;--ink2:#c4c5ca;--muted:#8e8f96;--brand:#ededee;--brand2:#b9bac0;--pos:#8fc79a;--lime:#b8c4d6;--gold:#d2b277;--warn:#dcb06b;--danger:#e58a8a;--r:22px;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Outfit,system-ui,-apple-system,Segoe UI,sans-serif}
body{min-height:100vh;background:radial-gradient(1200px 600px at 80% -10%,#0f3a27 0%,transparent 60%),radial-gradient(900px 500px at -10% 110%,#0b2a1d 0%,transparent 55%),var(--bg);background-attachment:fixed}
button{font-family:inherit;color:inherit}
input,select,textarea{font-family:inherit}
.ic{display:block;flex:none}
.money{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.muted{color:var(--muted)}.small{font-size:12px}
/* ---- layout ---- */
.shell{display:flex;min-height:100vh}
.side{display:none}
main{flex:1;min-width:0;max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(100px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 14px}
.hello{display:flex;align-items:center;gap:12px}
.hello h1{font-size:22px;margin:0;line-height:1.1}.hello p{margin:2px 0 0;color:var(--muted);font-size:13px}
.icon-btn{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--ink2);transition:transform .12s}
.icon-btn:active{transform:scale(.92)}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));width:min(528px,calc(100% - 24px));height:66px;border-radius:24px;background:rgba(12,26,20,.86);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);display:flex;align-items:center;justify-content:space-around;z-index:20;box-shadow:0 18px 40px rgba(0,0,0,.45)}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--muted);cursor:pointer;padding:6px 10px;border-radius:14px;transition:color .2s}
.nav button.on{color:var(--brand)}
.nav .fab{width:54px;height:54px;border-radius:19px;background:linear-gradient(145deg,var(--brand),var(--brand2));color:#032014;box-shadow:0 8px 24px rgba(46,229,157,.35);justify-content:center;padding:0;margin-top:-26px}
.nav .fab:active{transform:scale(.92)}
@media(min-width:900px){
  .nav{display:none}
  .side{display:flex;flex-direction:column;gap:6px;width:250px;flex:none;padding:28px 18px;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;background:rgba(6,16,12,.6)}
  .side .brandrow{display:flex;align-items:center;gap:10px;font-size:24px;font-weight:800;margin:0 8px 22px}
  .side button.nv{border:0;background:none;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;font-size:15px;font-weight:600;color:var(--ink2);cursor:pointer;text-align:left}
  .side button.nv.on{background:var(--card2);color:var(--brand)}
  .side .btn{margin-top:14px}
  main{max-width:1120px;padding:28px 36px 60px}
  .grid2{display:grid;grid-template-columns:1.1fr .9fr;gap:18px;align-items:start}
  .cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
  .top .only-mobile{display:none}
  .sheet{border-radius:26px!important;margin-bottom:auto!important;margin-top:auto!important}
  .overlay{align-items:center!important}
}
/* ---- cards ---- */
.card{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px}
.sec{display:flex;align-items:center;justify-content:space-between;margin:22px 4px 10px;font-size:15px;font-weight:700}
.sec button{white-space:nowrap;border:0;background:none;color:var(--brand);font-weight:700;font-size:13px;cursor:pointer}
.hero{position:relative;overflow:hidden;border-radius:28px;padding:22px;background:linear-gradient(150deg,#0f3a27 0%,#0a2219 55%,#07140f 100%);border:1px solid #1f4a35;margin-bottom:14px}
.hero::after{content:'';position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(46,229,157,.28),transparent 70%)}
.hero .lbl{font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:8px}
.hero .big{font-size:40px;font-weight:800;margin:6px 0 2px;position:relative;z-index:1}
.hero .row{display:flex;gap:10px;margin-top:16px;position:relative;z-index:1}
.hero .mini{flex:1;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.06);border-radius:16px;padding:10px 12px}
.hero .mini b{display:block;font-size:18px;margin-bottom:2px}.hero .mini>span{font-size:11.5px;color:var(--muted)}
.eye{border:0;background:rgba(255,255,255,.07);border-radius:10px;width:30px;height:26px;display:grid;place-items:center;cursor:pointer;color:var(--ink2)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:6px}
.quick button{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--ink2);cursor:pointer;transition:transform .12s,background .2s}
.quick button:active{transform:scale(.94);background:var(--card2)}
.quick .qi{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;background:rgba(46,229,157,.12);color:var(--brand)}
.quick .qi.red{background:rgba(255,93,108,.12);color:var(--danger)}.quick .qi.gold{background:rgba(245,197,66,.12);color:var(--gold)}.quick .qi.lime{background:rgba(198,244,50,.12);color:var(--lime)}
.list{padding:6px 14px}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.li:last-child{border-bottom:0}
.li .ico{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--card2);color:var(--brand);flex:none}
.li .mid{flex:1;min-width:0}.li .t{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.li .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.li .end{text-align:right;font-weight:700}.li .end small{display:block;font-weight:500;font-size:11.5px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:99px;background:var(--card2);color:var(--ink2)}
.pill.ok{background:rgba(143,199,154,.14);color:var(--pos)}.pill.warn{background:rgba(255,181,71,.14);color:var(--warn)}.pill.bad{background:rgba(255,93,108,.15);color:var(--danger)}
.empty{text-align:center;padding:26px 14px;color:var(--muted);font-size:14px;line-height:1.5}
.empty .mas{display:flex;justify-content:center;margin-bottom:8px}
/* tarjeta física */
.ccard{position:relative;border-radius:22px;padding:18px;min-height:190px;overflow:hidden;cursor:pointer;color:#fff;box-shadow:0 16px 34px rgba(0,0,0,.4);transition:transform .15s;margin-bottom:14px;display:flex;flex-direction:column}
.ccard:active{transform:scale(.98)}
.ccard::before{content:'';position:absolute;inset:0;background:radial-gradient(400px 200px at 110% -20%,rgba(255,255,255,.22),transparent 60%),radial-gradient(300px 160px at -10% 120%,rgba(0,0,0,.35),transparent 60%);pointer-events:none}
.ccard .h{display:flex;justify-content:space-between;align-items:flex-start;position:relative}
.ccard .bank{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.ccard .nm{font-size:19px;font-weight:700;margin-top:2px}
.ccard .chip{width:38px;height:28px;border-radius:7px;background:linear-gradient(135deg,#f7dd8a,#c9a13d);opacity:.9}
.ccard .amt{position:relative;margin-top:auto}
.ccard .amt small{font-size:11.5px;opacity:.75;display:block}
.ccard .amt b{font-size:26px;font-weight:800}
.ccard .bar{position:relative;height:7px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden;margin:10px 0 6px}
.ccard .bar i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:#fff}
.ccard .ft{position:relative;display:flex;justify-content:space-between;font-size:12px;opacity:.9}
.g-emerald{background:linear-gradient(135deg,#0f7a52,#0a3d2b)}.g-navy{background:linear-gradient(135deg,#1d4ed8,#0b1f55)}.g-black{background:linear-gradient(135deg,#2b2f33,#08090a)}.g-purple{background:linear-gradient(135deg,#7c3aed,#2e1065)}.g-red{background:linear-gradient(135deg,#dc2626,#5c0d0d)}.g-gold{background:linear-gradient(135deg,#caa04a,#5e4512)}.g-teal{background:linear-gradient(135deg,#0891b2,#083344)}.g-pink{background:linear-gradient(135deg,#db2777,#4a0a2a)}
/* utilization ring */
.ring-wrap{display:flex;align-items:center;gap:16px}
.ring-wrap .txt b{font-size:22px;display:block}
.tip{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:16px;background:var(--card2);font-size:13.5px;line-height:1.45;margin-top:10px;color:var(--ink2)}
.tip .ic{color:var(--gold);margin-top:1px}
.tip.bad .ic{color:var(--danger)}.tip.ok .ic{color:var(--pos)}
/* chart */
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:10px}
.bars .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars .pair{display:flex;gap:3px;align-items:flex-end;height:100%;width:100%;justify-content:center}
.bars .b{width:42%;max-width:18px;border-radius:6px 6px 3px 3px;background:var(--pos);transform-origin:bottom;animation:grow .7s cubic-bezier(.2,.8,.2,1) both}
.bars .b.out{background:var(--danger)}
.bars .col span{font-size:11px;color:var(--muted);text-transform:capitalize}
@keyframes grow{from{transform:scaleY(0)}}
.cat-row{display:flex;align-items:center;gap:10px;margin:10px 0}
.cat-row .nm{width:108px;font-size:13px;display:flex;align-items:center;gap:6px;color:var(--ink2)}
.cat-row .tr{flex:1;height:9px;border-radius:99px;background:var(--card2);overflow:hidden}
.cat-row .tr i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand2),var(--lime));transform-origin:left;animation:growx .8s cubic-bezier(.2,.8,.2,1) both}
.cat-row .v{width:86px;text-align:right;font-size:13px;font-weight:700}
@keyframes growx{from{transform:scaleX(0)}}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:8px}.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;background:var(--pos)}.legend i.out{background:var(--danger)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card2);border-radius:16px;padding:12px 14px}
.stat b{display:block;font-size:19px}.stat>span{font-size:12px;color:var(--muted)}
/* month switch */
.mswitch{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px;margin-bottom:12px}
.mswitch b{text-transform:capitalize}
/* sheets */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:50;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--bg2);border:1px solid var(--line);border-radius:28px 28px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.grab{width:42px;height:5px;border-radius:99px;background:var(--line);margin:4px auto 12px}
.shead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.shead h2{margin:0;font-size:21px}.shead p{margin:3px 0 0;color:var(--muted);font-size:13px}
.x{width:36px;height:36px;border-radius:12px;border:0;background:var(--card2);color:var(--ink2);display:grid;place-items:center;cursor:pointer;flex:none}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;color:var(--muted);margin:0 0 6px 2px;font-weight:600}
.field input,.field select{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px;outline:none;transition:border-color .2s}
.field input:focus,.field select:focus{border-color:var(--brand)}
.field .hint{font-size:11.5px;color:var(--muted);margin:5px 2px 0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}
.amount-in{font-size:40px!important;font-weight:800;text-align:center;padding:10px!important;background:transparent!important;border:0!important;border-bottom:2px solid var(--line)!important;border-radius:0!important}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chipb{border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:99px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chipb.on{background:rgba(46,229,157,.15);border-color:var(--brand);color:var(--brand)}
.swatches{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.sw{width:34px;height:34px;border-radius:12px;border:2px solid transparent;cursor:pointer}
.sw.on{border-color:#fff;box-shadow:0 0 0 2px var(--brand)}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;padding:10px;border-radius:10px;font-weight:700;font-size:13.5px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--card2);color:var(--ink)}
.btn{width:100%;border:0;border-radius:16px;padding:15px;font-size:16px;font-weight:700;background:linear-gradient(145deg,var(--brand),var(--brand2));color:#032014;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s,opacity .2s}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.5}
.btn.alt{background:var(--card2);color:var(--ink)}
.btn.danger{background:rgba(255,93,108,.14);color:var(--danger)}
.btn+.btn{margin-top:10px}
.linkb{border:0;background:none;color:var(--brand);font-weight:700;cursor:pointer;padding:0;font-size:inherit}
.tgl{appearance:none;-webkit-appearance:none;width:48px;height:29px;border-radius:99px;background:#2a3f35;position:relative;cursor:pointer;flex:none;transition:background .2s;margin:0}
.tgl::after{content:'';position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;background:#fff;transition:transform .22s cubic-bezier(.3,1.4,.5,1)}
.tgl:checked{background:var(--brand2)}.tgl:checked::after{transform:translateX(19px)}
.kv{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}.kv:last-child{border-bottom:0}.kv>span{color:var(--muted)}.kv b{font-weight:700}
.plan{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);margin-bottom:8px}
.plan .mid{flex:1}.plan .t{font-weight:650;font-size:14px}.plan .s{font-size:12px;color:var(--muted)}
/* auth */
.auth{position:fixed;inset:0;z-index:90;display:none;overflow:auto;background:var(--bg)}
.auth.open{display:block}
.auth-box{max-width:420px;margin:auto;min-height:100vh;padding:40px 22px;display:flex;flex-direction:column;justify-content:center}
.auth-logo{display:flex;justify-content:center}
.auth h1{text-align:center;font-size:40px;margin:10px 0 4px;letter-spacing:-.03em}
.auth .sub{text-align:center;color:var(--ink2);line-height:1.45;margin:0 0 22px}.auth .sub b{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}
.err{display:none;background:rgba(255,93,108,.12);color:#ffb3bb;border-radius:12px;padding:10px 12px;font-size:13.5px;margin-bottom:12px}
.switch{text-align:center;margin-top:14px;color:var(--muted);font-size:14px}
/* splash + toast + confetti */
.splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;transition:opacity .35s}
.splash.hide{opacity:0;pointer-events:none}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#eafff4;color:#06100c;border-radius:18px;padding:8px 16px 8px 8px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;box-shadow:0 12px 30px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:95;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:96;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:9px;height:14px;border-radius:3px;animation:fall 1.6s cubic-bezier(.2,.6,.4,1) forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.2}}
.coinburst{position:fixed;inset:0;pointer-events:none;z-index:96;display:grid;place-items:center}
.coinburst .pop{animation:pop 1.2s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes pop{0%{transform:scale(.2);opacity:0}25%{transform:scale(1.1);opacity:1}70%{transform:scale(1);opacity:1}100%{transform:scale(.9) translateY(-40px);opacity:0}}
.hidden-amt .money.sens{filter:blur(9px);user-select:none}
/* mascota */
.coin-svg{overflow:visible;display:block;cursor:pointer}
.coin-svg .cb{transform-box:fill-box;transform-origin:50% 50%;animation:cfloat 3.2s ease-in-out infinite}
.coin-svg .cs{transform-box:fill-box;transform-origin:50% 50%;animation:cshadow 3.2s ease-in-out infinite}
.coin-svg .shine{animation:cshine 4.5s ease-in-out infinite}
.coin-svg .glass{transform-box:fill-box;transform-origin:50% 50%;animation:cglass 6s ease-in-out infinite}
.coin-svg .arm{transform-box:fill-box;transform-origin:20% 10%}
.coin-svg .head{transform-box:fill-box;transform-origin:50% 90%;animation:chead 3.2s ease-in-out infinite}
.coin-svg .case{transform-box:fill-box;transform-origin:50% 0%;animation:ccase 2.2s ease-in-out infinite}
.coin-svg .bill{opacity:0}
.coin-svg.m-celebrate .bill,.coin-svg.m-happy .bill{animation:cbill 1.2s ease-out infinite}
.coin-svg .b2{animation-delay:.3s!important}.coin-svg .b3{animation-delay:.6s!important}
.coin-svg.m-wave .arm.l{animation:cwavel .9s ease-in-out infinite}
@keyframes chead{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes ccase{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes cwavel{0%,100%{transform:rotate(0)}50%{transform:rotate(55deg)}}
@keyframes cbill{0%{opacity:0;transform:translate(0,0) rotate(0)}20%{opacity:1}100%{opacity:0;transform:translate(var(--bx,6px),-38px) rotate(40deg)}}
.coin-svg .b1{--bx:-10px}.coin-svg .b3{--bx:14px}
.coin-svg.m-happy .cb{animation:chop .9s cubic-bezier(.3,1.6,.5,1) infinite}
.coin-svg.m-celebrate .cb{animation:cspin 1.1s cubic-bezier(.3,1.3,.5,1) infinite}
.coin-svg.m-think .cb{animation:ctilt 2.4s ease-in-out infinite}
.coin-svg.m-sleep .cb{animation:cbreath 4s ease-in-out infinite}
.coin-svg .z{animation:zz 2.4s ease-in-out infinite;opacity:0}.coin-svg .z2{animation-delay:.8s}.coin-svg .z3{animation-delay:1.6s}
.coin-svg:active .cb{animation:csquish .35s ease}
@keyframes cfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes cshadow{0%,100%{transform:scaleX(1);opacity:.35}50%{transform:scaleX(.8);opacity:.2}}
@keyframes cshine{0%,60%{transform:translateX(-80px)}80%,100%{transform:translateX(90px)}}
@keyframes cglass{0%,90%,100%{transform:translateY(0)}94%{transform:translateY(-3px)}}
@keyframes cwave{0%,100%{transform:rotate(0)}50%{transform:rotate(-28deg)}}
@keyframes chop{0%,100%{transform:translateY(0) scale(1)}40%{transform:translateY(-12px) scale(1.03,.97)}}

const CATS=[['Comida','food'],['Súper','cart'],['Transporte','car'],['Casa','house'],['Servicios','bolt'],['Salud','heart'],['Diversión','fun'],['Compras','bag'],['Suscripciones','repeat'],['Educación','book'],['Regalos','gift'],['Otros','dots']];

/* ====================== cálculo por cuenta ====================== */
function plansInfo(a){
  const now=monthKey();let monthly=0,left=0;
  const list=(a.plans||[]).map(p=>{const done=Math.max(0,monthsBetween(p.start,now));const rem=Math.max(0,p.months-done);const m=p.total/p.months;if(rem>0){monthly+=m;left+=m*rem}return {...p,rem,monthly:m}}).filter(p=>p.rem>0);
  return {list,monthly,left};
}
function info(a){
  const t=today();
  const due=a.pay_day?nextDue(t,a.pay_day):null;
  const left=due?diffDays(t,due):null;
  const cycle=due?due.slice(0,7):null;
  const paid=!!(cycle&&a.paid_cycle===cycle);
  const bal=Number(a.balance||0);
  let toPay=0,min=0;
  if(a.kind==='card'){toPay=a.no_interest_payment!=null?Number(a.no_interest_payment):bal;min=Number(a.min_payment||0)}
  else{toPay=Number(a.monthly_payment||0);min=toPay}
  const owes=a.kind==='card'?(bal>0||toPay>0):toPay>0;
  const util=a.kind==='card'&&a.credit_limit?bal/a.credit_limit:null;
  const avail=a.kind==='card'&&a.credit_limit?Math.max(0,a.credit_limit-bal):null;
  let status='none',label='Sin fecha';
  if(due){
    if(paid){status='ok';label='Pagado'}
    else if(!owes){status='ok';label='Sin saldo'}
    else if(left===0){status='bad';label='Hoy'}
    else if(left<=3){status='bad';label=left===1?'Mañana':'En '+left+' días'}
    else if(left<=7){status='warn';label='En '+left+' días'}
    else{status='none';label=fmtDay(due)}
  }
  let cut=null;if(a.kind==='card'&&a.cut_day){const [y,m]=t.split('-').map(Number);cut=nextDue(t,a.cut_day)}
  return {due,left,cycle,paid,toPay,min,bal,util,avail,status,label,cut,owes,plans:plansInfo(a)};
}
function payoff(B,P,rate){ // meses e intereses aproximados
  B=+B;P=+P;if(!(B>0)||!(P>0))return null;const r=(+rate||0)/1200;
  if(r===0)return {n:Math.ceil(B/P),interest:0};
  if(P<=B*r)return {n:Infinity,interest:Infinity};
  const n=Math.ceil(-Math.log(1-r*B/P)/Math.log(1+r));return {n,interest:Math.max(0,n*P-B)};
}
function totals(){
  const act=accounts.filter(a=>!a.archived);
  const cards=act.filter(a=>a.kind==='card'),loans=act.filter(a=>a.kind==='loan'),bills=act.filter(a=>a.kind==='bill');
  const debt=cards.concat(loans).reduce((s,a)=>s+Number(a.balance||0),0);
  const limit=cards.reduce((s,a)=>s+Number(a.credit_limit||0),0);
  const used=cards.reduce((s,a)=>s+Number(a.balance||0),0);
  const monthly=act.reduce((s,a)=>{const i=info(a);return s+(i.owes?i.toPay:0)},0);
  const pending=act.reduce((s,a)=>{const i=info(a);return s+(i.owes&&!i.paid&&i.left!=null&&i.left<=31?i.toPay:0)},0);
  return {act,cards,loans,bills,debt,limit,used,util:limit?used/limit:null,monthly,pending};
}

  const [a,m,s]=await Promise.all([

    sb.from('fz_moves').select('*').gte('day',since).order('day',{ascending:false}).order('created_at',{ascending:false}),
    sb.from('fz_settings').select('*').maybeSingle(),
  ]);
  if(a.error)throw a.error;if(m.error)throw m.error;
  accounts=a.data||[];moves=m.data||[];settings=s.data||{monthly_income:null};
}
async function saveSettings(patch){
  settings={...settings,...patch};
  const row={user_id:user.id,monthly_income:settings.monthly_income,budget:settings.budget,updated_at:new Date().toISOString()};if(settings.remind_days)row.remind_days=settings.remind_days;
  const {error}=await sb.from('fz_settings').upsert(row);
  if(error)throw error;
}

/* ====================== navegación ====================== */
const VIEWS=[['home','Inicio','home'],['accounts','Tarjetas','card'],['moves','Movimientos','list'],['stats','Métricas','chart']];
function buildNav(){
  const n=$('nav');
  n.innerHTML=VIEWS.slice(0,2).map(v=>navBtn(v)).join('')+`<button class="fab" data-nosfx onclick="sfx('open');openQuick()" aria-label="Agregar">${ic('plus',26,2.4)}</button>`+VIEWS.slice(2).map(v=>navBtn(v)).join('');
  $('side').innerHTML=`<div class="brandrow">${logoSVG(38)} North</div>`+VIEWS.concat([['settings','Ajustes','settings']]).map(v=>`<button class="nv ${view===v[0]?'on':''}" onclick="go('${v[0]}')">${ic(v[2],20)} ${v[1]}</button>`).join('')+`<button class="btn" onclick="sfx('open');openQuick()">${ic('plus',18,2.4)} Agregar</button>`;
}
function navBtn(v){return `<button class="${view===v[0]?'on':''}" onclick="go('${v[0]}')">${ic(v[2],22)}<span>${v[1]}</span></button>`}
function go(v){if(v!==view)sfx('toggle');buzz(6);view=v;buildNav();render();window.scrollTo({top:0,behavior:'smooth'})}
function buzz(ms=8){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}
function hideOn(){return ls('lana_hide')==='on'}
function toggleHide(){ls('lana_hide',hideOn()?'off':'on');document.body.classList.toggle('hidden-amt',hideOn());sfx('toggle');render()}
function render(){
  document.body.classList.toggle('hidden-amt',hideOn());
  const m=$('main');
  const html=view==='home'?homeView():view==='accounts'?accountsView():view==='moves'?movesView():view==='stats'?statsView():settingsView();
  m.innerHTML=html;m.firstElementChild&&m.classList.remove('fade-in');void m.offsetWidth;m.classList.add('fade-in');
}
function topBar(title){
  return `<div class="top"><div class="hello">${title?`<h1 style="font-size:26px">${title}</h1>`:`${coinSVG(56,'wave')}<div><h1>${greetWord()}${userName()?', '+esc(userName()):''}</h1><p>${fmtDay(today(),{weekday:'long',day:'numeric',month:'long'})}</p></div>`}</div>
  <div style="display:flex;gap:8px"><button class="icon-btn" onclick="toggleHide()" aria-label="Ocultar montos">${ic(hideOn()?'eyeOff':'eye',20)}</button><button class="icon-btn only-mobile" onclick="go('settings')" aria-label="Ajustes">${ic('settings',20)}</button></div></div>`;
}

/* ====================== Inicio ====================== */
function homeView(){
  const T=totals();
  const upcoming=T.act.map(a=>({a,i:info(a)})).filter(x=>x.i.due).sort((x,y)=>(x.i.paid-y.i.paid)||(x.i.left-y.i.left)).slice(0,6);
  const mk=monthKey(),mm=monthMoves(mk);const spent=sumKind(mm,'expense'),inc=sumKind(mm,'income'),paidM=sumKind(mm,'payment');
  const income=Number(settings.monthly_income||0)||inc;
  if(!T.act.length&&!moves.length)return topBar()+`<div class="card empty">${`<div class="mas">${coinSVG(120,'wave')}</div>`}<b style="color:var(--ink);font-size:18px">¡Vamos a ordenar tu lana!</b><br>Empieza agregando tu primera tarjeta de crédito: cuánto te prestaron, cuánto llevas usado y cuándo pagas. Yo te aviso antes de cada fecha.<div style="margin-top:16px"><button class="btn" onclick="openAccount(null,'card')">${ic('card',18)} Agregar mi primera tarjeta</button><button class="btn alt" onclick="openAccount(null,'loan')">${ic('loan',18)} Agregar un préstamo</button></div></div>`+quickRow();
  const utilPct=T.util!=null?Math.round(T.util*100):null;
  const left=`
  <section class="hero">
    <div class="lbl">Deuda total <button class="eye" onclick="toggleHide()" aria-label="Ocultar">${ic(hideOn()?'eyeOff':'eye',15)}</button></div>
    <div class="big">${M(T.debt)}</div>
    <div class="muted small" style="position:relative;z-index:1">${T.cards.length} tarjeta${T.cards.length===1?'':'s'} · ${T.loans.length} préstamo${T.loans.length===1?'':'s'} · ${T.bills.length} pago${T.bills.length===1?'':'s'} fijo${T.bills.length===1?'':'s'}</div>
    <div class="row">
      <div class="mini"><b>${M(T.pending)}</b><span>Por pagar próximos 30 días</span></div>
      <div class="mini"><b>${T.limit?M(Math.max(0,T.limit-T.used)):'—'}</b><span>Crédito disponible</span></div>
    </div>
  </section>
  ${quickRow()}
  <div class="sec">Próximos pagos <button onclick="go('accounts')">Ver todo</button></div>
  <section class="card list">${upcoming.length?upcoming.map(({a,i})=>payRow(a,i)).join(''):'<div class="empty">Agrega tus tarjetas y pagos fijos para ver aquí tus fechas.</div>'}</section>`;
  const right=`
  ${T.limit?`<div class="sec">Uso de tu crédito</div>
  <section class="card"><div class="ring-wrap">${ring(T.util||0,88)}<div class="txt"><b>${utilPct}% usado</b><span class="muted small">${M(T.used)} de ${M(T.limit)}</span></div></div>${utilTip(T.util)}</section>`:''}
  <div class="sec">Este mes <button onclick="go('stats')">Métricas</button></div>
  <section class="card"><div class="stats">
    <div class="stat"><b style="color:var(--danger)">${M(spent)}</b><span>Gastado</span></div>
    <div class="stat"><b style="color:var(--pos)">${M(income)}</b><span>${settings.monthly_income?'Ingreso mensual':'Ingresos'}</span></div>
    <div class="stat"><b>${M(paidM)}</b><span>Abonado a deudas</span></div>
    <div class="stat"><b>${income?Math.round(T.monthly/income*100)+'%':'—'}</b><span>De tu ingreso va a deudas</span></div>
  </div>${!settings.monthly_income?`<div class="tip">${ic('bulb',18)}<div>Pon tu ingreso mensual en <button class="linkb" onclick="openIncome()">Ajustes</button> para calcular cuánto de tu sueldo se va en pagos.</div></div>`:''}</section>
  <div class="sec">Últimos movimientos <button onclick="go('moves')">Ver todo</button></div>
  <section class="card list">${moves.slice(0,5).map(moveRow).join('')||'<div class="empty">Aún no registras gastos. Toca el botón + para anotar uno.</div>'}</section>`;
  return topBar()+`<div class="grid2"><div>${left}</div><div>${right}</div></div>`;
}
function quickRow(){return `<div class="quick">
  <button onclick="openMove('expense')"><div class="qi red">${ic('down',20)}</div>Gasto</button>
  <button onclick="openMove('income')"><div class="qi">${ic('up',20)}</div>Ingreso</button>
  <button onclick="openPayPicker()"><div class="qi lime">${ic('pay',20)}</div>Pagar</button>
  <button onclick="openAccount(null,'card')"><div class="qi gold">${ic('card',20)}</div>Tarjeta</button></div>`}
function payRow(a,i){
  const icon=a.kind==='card'?'card':a.kind==='loan'?'loan':'repeat';
  return `<div class="li" onclick="openDetail('${a.id}')"><div class="ico">${ic(icon,19)}</div><div class="mid"><div class="t">${esc(a.name)}</div><div class="s">${i.due?(i.paid?'Pagado este periodo':'Pagar antes del '+fmtDay(i.due)):'Sin día de pago'}</div></div><div class="end">${i.owes&&!i.paid?M(i.toPay):''}<small><span class="pill ${i.status}">${i.status==='ok'?ic('check',12,2.6):''}${i.label}</span></small></div></div>`;
}
function ring(p,s=80){const r=s/2-8,c=2*Math.PI*r,v=Math.min(1,Math.max(0,p));const col=v>.7?'var(--danger)':v>.3?'var(--warn)':'var(--pos)';
  return `<svg width="${s}" height="${s}" viewBox="0 0 ${s} ${s}" style="flex:none"><circle cx="${s/2}" cy="${s/2}" r="${r}" stroke="var(--card2)" stroke-width="9" fill="none"/><circle cx="${s/2}" cy="${s/2}" r="${r}" stroke="${col}" stroke-width="9" fill="none" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c}" transform="rotate(-90 ${s/2} ${s/2})"><animate attributeName="stroke-dashoffset" from="${c}" to="${c*(1-v)}" dur=".9s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1"/></circle><text x="50%" y="54%" text-anchor="middle" font-size="${s/4.6}" font-weight="800" fill="var(--ink)">${Math.round(v*100)}%</text></svg>`}
function utilTip(u){if(u==null)return '';
  if(u>.7)return `<div class="tip bad">${ic('alert',18)}<div>Estás usando más del 70% de tu crédito. Esto baja tu calificación en el Buró; trata de bajarlo a menos del 30%.</div></div>`;
  if(u>.3)return `<div class="tip">${ic('bulb',18)}<div>Lo ideal es usar menos del 30% de tu línea de crédito. Vas bien, pero cuida no subir más.</div></div>`;
  return `<div class="tip ok">${ic('check',18)}<div>¡Muy bien! Usas menos del 30% de tu crédito, eso ayuda a tu historial.</div></div>`}

      <div class="h"><div><div class="bank">${esc(a.bank||'Tarjeta')}</div><div class="nm">${esc(a.name)}</div></div><div class="chip"></div></div>
      <div class="amt"><small>Llevas usado</small><b>${M(i.bal)}</b>
      ${pct!=null?`<div class="bar"><i style="width:${pct}%;${pct>70?'background:#ffb3bb':''}"></i></div><div class="ft"><span>Límite ${M(a.credit_limit)}</span><span>Disponible ${M(i.avail)}</span></div>`:''}
      <div class="ft" style="margin-top:6px"><span>${a.cut_day?'Corte día '+a.cut_day:''}</span><span>${i.due?(i.paid?'Pagado ✓':'Pagar '+fmtDay(i.due)):''}</span></div></div></div>`};
  const row=(a)=>{const i=info(a);return `<div class="li" onclick="openDetail('${a.id}')"><div class="ico">${ic(a.kind==='loan'?'loan':'repeat',19)}</div><div class="mid"><div class="t">${esc(a.name)}</div><div class="s">${a.kind==='loan'?`Debes ${mxn(i.bal)}${a.payments_left?' · faltan '+a.payments_left+' pagos':''}`:'Cada mes'}${a.pay_day?' · día '+a.pay_day:''}</div></div><div class="end">${M(i.toPay)}<small><span class="pill ${i.status}">${i.label}</span></small></div></div>`};

  ${T.cards.length?`<div class="cards-grid">${T.cards.map(card).join('')}</div>`:`<section class="card empty">Aquí van tus tarjetas: cuánto crédito te dieron, cuánto llevas usado y cuándo pagas.<div style="margin-top:12px"><button class="btn" onclick="openAccount(null,'card')">${ic('plus',18)} Agregar tarjeta</button></div></section>`}
  <div class="sec">Préstamos y créditos <button onclick="openAccount(null,'loan')">+ Agregar</button></div>

  <div class="sec">Pagos fijos <button onclick="openAccount(null,'bill')">+ Agregar</button></div>
  <section class="card list">${T.bills.map(row).join('')||'<div class="empty">Renta, internet, celular, Netflix, gimnasio… lo que pagas cada mes.</div>'}</section>`;
}

function openSheet(html){$('sheet').innerHTML=html;$('overlay').classList.add('open');$('sheet').scrollTop=0}
function closeSheet(){if($('overlay').classList.contains('open'))sfx('close');$('overlay').classList.remove('open')}
$('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeSheet()});
function head(t,sub,back){return `<div class="grab"></div><div class="shead">${back?`<button class="x" onclick="${back}" aria-label="Atrás">${ic('back',18)}</button>`:''}<div style="flex:1"><h2>${t}</h2>${sub?`<p>${sub}</p>`:''}</div><button class="x" onclick="closeSheet()" aria-label="Cerrar">${ic('close',18)}</button></div>`}
function pick(el,group){document.querySelectorAll(`[data-g="${group}"]`).forEach(b=>b.classList.remove('on'));el.classList.add('on')}
function picked(group){return document.querySelector(`[data-g="${group}"].on`)?.dataset.v}

/* ---- alta / edición de cuenta ---- */
function openAccount(id,kind){
  const a=id?accounts.find(x=>x.id===id):{kind,color:COLORS[accounts.filter(x=>x.kind==='card').length%COLORS.length]};
  kind=a.kind;const v=(k)=>a[k]??'';
  const bankChips=kind!=='bill'?`<div class="field"><label>${kind==='card'?'Banco':'Institución'}</label><div class="chips">${BANKS.map(b=>`<button class="chipb ${a.bank===b?'on':''}" data-g="bank" data-v="${b}" onclick="pick(this,'bank')">${b}</button>`).join('')}</div></div>`:'';
  let fields='';
  if(kind==='card')fields=`
    <div class="field"><label>Nombre de la tarjeta</label><input id="fName" value="${esc(v('name'))}" placeholder="Ej. BBVA Azul, Nu, Oro"></div>${bankChips}
    <div class="field"><label>Color</label><div class="swatches">${COLORS.map(c=>`<button class="sw g-${c} ${a.color===c?'on':''}" data-g="color" data-v="${c}" onclick="pick(this,'color')" aria-label="${c}"></button>`).join('')}</div></div>
    <div class="row2"><div class="field"><label>Crédito que te dieron</label><input id="fLimit" inputmode="decimal" value="${v('credit_limit')}" placeholder="Ej. 25000"></div>
    <div class="field"><label>Cuánto llevas usado</label><input id="fBal" inputmode="decimal" value="${v('balance')}" placeholder="Ej. 8500"></div></div>
    <div class="row2"><div class="field"><label>Día de corte</label><input id="fCut" inputmode="numeric" value="${v('cut_day')}" placeholder="Ej. 5"></div>
    <div class="field"><label>Día límite de pago</label><input id="fPay" inputmode="numeric" value="${v('pay_day')}" placeholder="Ej. 25"></div></div>
    <div class="row2"><div class="field"><label>Para no generar intereses</label><input id="fNoInt" inputmode="decimal" value="${v('no_interest_payment')}" placeholder="Ej. 8200"></div>
    <div class="field"><label>Pago mínimo</label><input id="fMin" inputmode="decimal" value="${v('min_payment')}" placeholder="Opcional"></div></div>
    <div class="field"><label>Tasa de interés anual (%)</label><input id="fRate" inputmode="decimal" value="${v('rate')}" placeholder="Opcional, ej. 65"><div class="hint">Viene como CAT o tasa anual en tu estado de cuenta. Sirve para calcular cuánto pagarías de intereses.</div></div>`;
  else if(kind==='loan')fields=`
    <div class="field"><label>Nombre</label><input id="fName" value="${esc(v('name'))}" placeholder="Ej. Crédito del carro"></div>${bankChips}
    <div class="row2"><div class="field"><label>Cuánto debes todavía</label><input id="fBal" inputmode="decimal" value="${v('balance')}" placeholder="Ej. 120000"></div>
    <div class="field"><label>Mensualidad</label><input id="fMonthly" inputmode="decimal" value="${v('monthly_payment')}" placeholder="Ej. 4500"></div></div>
    <div class="row2"><div class="field"><label>Pagos que faltan</label><input id="fLeft" inputmode="numeric" value="${v('payments_left')}" placeholder="Ej. 24"></div>
    <div class="field"><label>Día de pago</label><input id="fPay" inputmode="numeric" value="${v('pay_day')}" placeholder="Ej. 15"></div></div>
    <div class="field"><label>Tasa anual (%)</label><input id="fRate" inputmode="decimal" value="${v('rate')}" placeholder="Opcional"></div>`;
  else fields=`
    <div class="field"><label>¿Qué pagas?</label><input id="fName" value="${esc(v('name'))}" placeholder="Ej. Renta, Internet, Netflix"></div>
    <div class="row2"><div class="field"><label>Cuánto al mes</label><input id="fMonthly" inputmode="decimal" value="${v('monthly_payment')}" placeholder="Ej. 499"></div>
    <div class="field"><label>Día de pago</label><input id="fPay" inputmode="numeric" value="${v('pay_day')}" placeholder="Ej. 1"></div></div>`;
  openSheet(head(id?'Editar':'Agregar '+KIND_LBL[kind].toLowerCase(),kind==='card'?'Los datos vienen en tu app del banco o en tu estado de cuenta.':'',id?`openDetail('${id}')`:'')+fields+`
    <div class="li" style="cursor:default"><div class="ico">${ic('bell',19)}</div><div class="mid"><div class="t">Avisarme antes de pagar</div><div class="s">${remindTxt()}${kind==='card'?', y en tu fecha de corte':''}</div></div><input type="checkbox" class="tgl" id="fNotify" ${a.notify===false?'':'checked'} onchange="sfx('toggle')"></div>
    <button class="btn" style="margin-top:14px" id="fSave" onclick="saveAccount('${id||''}','${kind}')">${ic('check',18)} Guardar</button>`);
}
function dayVal(id){const n=parseInt(($(id)?.value||'').trim());return n>=1&&n<=31?n:null}
async function saveAccount(id,kind){
  const name=$('fName').value.trim();if(!name){$('fName').focus();toast('Ponle un nombre','think');return}
  const row={kind,name,bank:picked('bank')||null,notify:$('fNotify').checked,pay_day:dayVal('fPay')};
  if(kind==='card')Object.assign(row,{color:picked('color')||'emerald',credit_limit:num($('fLimit').value),balance:num($('fBal').value)||0,cut_day:dayVal('fCut'),no_interest_payment:num($('fNoInt').value),min_payment:num($('fMin').value),rate:num($('fRate').value)});
  if(kind==='loan')Object.assign(row,{balance:num($('fBal').value)||0,monthly_payment:num($('fMonthly').value),payments_left:parseInt($('fLeft').value)||null,rate:num($('fRate').value)});
  if(kind==='bill')Object.assign(row,{balance:0,monthly_payment:num($('fMonthly').value)});
  if(kind==='card'&&row.credit_limit!=null&&row.balance>row.credit_limit*1.5){if(!confirm('Lo usado es mucho mayor al límite. ¿Seguro?'))return}
  $('fSave').disabled=true;
  try{
    if(id){const {error}=await sb.from('fz_accounts').update(row).eq('id',id);if(error)throw error;Object.assign(accounts.find(x=>x.id===id),row)}
    else{const {data,error}=await sb.from('fz_accounts').insert({...row,user_id:user.id}).select().single();if(error)throw error;accounts.push(data);id=data.id}
    sfx('ok');render();
    if(!ls('lana_push_asked')&&pushState()==='off'&&row.notify&&row.pay_day){ls('lana_push_asked','1');openNotifPrompt(id);return}
    openDetail(id);toast('¡Guardado!');
  }catch(e){console.error(e);$('fSave').disabled=false;alert('No se pudo guardar: '+(e.message||e))}
}

/* ---- detalle de cuenta ---- */
function openDetail(id){
  const a=accounts.find(x=>x.id===id);if(!a)return;const i=info(a);
  let top='';
  if(a.kind==='card'){
    const pct=i.util!=null?Math.round(i.util*100):null;
    top=`<div class="ccard g-${a.color||'emerald'}" style="cursor:default;min-height:170px"><div class="h"><div><div class="bank">${esc(a.bank||'Tarjeta')}</div><div class="nm">${esc(a.name)}</div></div><div class="chip"></div></div>
    <div class="amt"><small>Llevas usado</small><b>${M(i.bal)}</b>${pct!=null?`<div class="bar"><i style="width:${Math.min(100,pct)}%"></i></div><div class="ft"><span>${pct}% de ${M(a.credit_limit)}</span><span>Libre ${M(i.avail)}</span></div>`:''}</div></div>`;
  }
  const kv=[];
  if(a.kind==='card'){
    if(a.cut_day)kv.push(['Fecha de corte','Día '+a.cut_day+(i.cut?' · próxima '+fmtDay(i.cut):'')]);
    if(i.due)kv.push(['Fecha límite de pago',fmtDay(i.due,{weekday:'short',day:'numeric',month:'short'})]);
    kv.push(['Para no generar intereses',M(i.toPay)]);
    if(a.min_payment)kv.push(['Pago mínimo',M(a.min_payment)]);
    if(a.rate)kv.push(['Tasa anual',a.rate+'%']);
  }else if(a.kind==='loan'){
    kv.push(['Debes',M(i.bal)],['Mensualidad',M(a.monthly_payment)]);
    if(a.payments_left)kv.push(['Pagos que faltan',a.payments_left+' ('+monthName(monthKey(a.payments_left-1),true)+')']);
    if(i.due)kv.push(['Próximo pago',fmtDay(i.due,{weekday:'short',day:'numeric',month:'short'})]);
    if(a.rate)kv.push(['Tasa anual',a.rate+'%']);
  }else{kv.push(['Cada mes',M(a.monthly_payment)]);if(i.due)kv.push(['Próximo pago',fmtDay(i.due,{weekday:'short',day:'numeric',month:'short'})])}
  // simulación de pago
  let sim='';
  if(a.kind==='card'&&i.bal>0&&a.min_payment&&a.rate){
    const pm=payoff(i.bal,a.min_payment,a.rate);

async function savePlan(id){

/* ---- registrar pago ---- */
function openPayPicker(){
  const T=totals();const list=T.act.map(a=>({a,i:info(a)})).sort((x,y)=>(x.i.paid-y.i.paid)||((x.i.left??99)-(y.i.left??99)));
  if(!list.length){openAccount(null,'card');return}
  openSheet(head('¿Qué vas a pagar?')+`<section class="card list">${list.map(({a,i})=>payRow(a,i).replace(`openDetail('${a.id}')`,`openPay('${a.id}')`)).join('')}</section>`);
}
function openPay(id){
  const a=accounts.find(x=>x.id===id),i=info(a);
  const opts=[];
  if(a.kind==='card'){if(i.toPay>0)opts.push(['No generar intereses',i.toPay]);if(a.min_payment)opts.push(['Pago mínimo',Number(a.min_payment)]);if(i.bal>0&&i.bal!==i.toPay)opts.push(['Todo lo que debo',i.bal])}
  else if(a.monthly_payment)opts.push(['Mensualidad',Number(a.monthly_payment)]);
  const def=opts[0]?.[1]||'';
  openSheet(head('Pago a '+esc(a.name),i.due?'Fecha límite: '+fmtDay(i.due,{weekday:'long',day:'numeric',month:'long'}):'',`openDetail('${id}')`)+`
  <div class="field"><input id="payAmt" class="amount-in" inputmode="decimal" value="${def}" placeholder="$0"></div>
  ${opts.length?`<div class="chips" style="justify-content:center">${opts.map(([l,v],k)=>`<button class="chipb ${k===0?'on':''}" data-g="po" onclick="pick(this,'po');$('payAmt').value='${v}'">${l} · ${mxn(v)}</button>`).join('')}</div>`:''}
  <div class="field"><label>Fecha</label><input id="payDay" type="date" value="${today()}"></div>
  <button class="btn" onclick="savePay('${id}',this)">${ic('check',18)} Ya pagué</button>`);
}
async function savePay(id,btn){
  const a=accounts.find(x=>x.id===id),i=info(a);const amt=num($('payAmt').value);
  if(!amt||amt<=0){toast('Escribe cuánto pagaste','think');return}
  btn.disabled=true;
  try{
    const patch={};
    if(a.kind!=='bill')patch.balance=Math.max(0,Math.round((Number(a.balance||0)-amt)*100)/100);
    if(a.kind==='loan'&&a.payments_left&&amt>=Number(a.monthly_payment||0)*.95)patch.payments_left=Math.max(0,a.payments_left-1);
    const enough=a.kind==='card'?amt>=(Number(a.min_payment||0)||Math.min(i.toPay,1)):amt>=Number(a.monthly_payment||0)*.95;
    if(i.cycle&&enough)patch.paid_cycle=i.cycle;
    const {error}=await sb.from('fz_accounts').update(patch).eq('id',id);if(error)throw error;
    const {data:mv,error:e2}=await sb.from('fz_moves').insert({user_id:user.id,account_id:id,kind:'payment',amount:amt,category:a.kind==='bill'?'Servicios':'Pago',note:a.name,day:$('payDay').value||today()}).select().single();if(e2)throw e2;
    Object.assign(a,patch);moves.unshift(mv);moves.sort((x,y)=>y.day.localeCompare(x.day));
    sfx('coin');setTimeout(()=>sfx('celebrate'),250);buzz(30);coinBurst();confetti();
    closeSheet();render();
    const msg=a.kind==='card'&&patch.balance===0?'¡Tarjeta en ceros! Eres una máquina':patch.paid_cycle?'¡Pago registrado! Uno menos':'Abono registrado';
    setTimeout(()=>toast(msg,'celebrate'),600);
  }catch(e){console.error(e);btn.disabled=false;alert('No se pudo guardar: '+(e.message||e))}
}

function statsView(){
  const T=totals();const months=[...Array(6)].map((_,k)=>monthKey(k-5));
  const data=months.map(k=>{const l=monthMoves(k);return {k,inc:sumKind(l,'income'),out:sumKind(l,'expense')+sumKind(l,'payment')}});
  const max=Math.max(1,...data.map(d=>Math.max(d.inc,d.out)));
  const cur=monthMoves(monthKey()).filter(m=>m.kind==='expense');const byCat={};cur.forEach(m=>{byCat[m.category||'Otros']=(byCat[m.category||'Otros']||0)+Number(m.amount)});
  const cats=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);const cmax=Math.max(1,...cats.map(c=>c[1]));
  const prev=sumKind(monthMoves(monthKey(-1)),'expense'),now=sumKind(monthMoves(monthKey()),'expense');
  const dayN=new Date().getDate(),dim=lastDay(new Date().getFullYear(),new Date().getMonth()+1),proj=now/dayN*dim;
  const income=Number(settings.monthly_income||0);
  const tips=[];

  if(income&&T.monthly/income>.35)tips.push(['alert','bad',`Tus pagos del mes son el ${Math.round(T.monthly/income*100)}% de tu ingreso. Lo sano es menos del 30–35%.`]);
  if(prev&&now>prev*1.15&&dayN>10)tips.push(['bulb','',`Llevas ${mxn(now-prev)} más de gasto que todo el mes pasado.`]);
  if(cats[0]&&now)tips.push(['bulb','',`Tu gasto más grande este mes es ${cats[0][0]}: ${Math.round(cats[0][1]/now*100)}% de lo que gastas.`]);
  const high=T.cards.concat(T.loans).filter(a=>a.rate&&a.balance>0).sort((a,b)=>b.rate-a.rate)[0];
  if(high&&T.cards.concat(T.loans).filter(a=>a.balance>0).length>1)tips.push(['bulb','',`Si te sobra dinero, abónalo primero a ${high.name} (${high.rate}% anual): es la deuda que más intereses te cobra.`]);
  if(!tips.length)tips.push(['check','ok','Todo en orden. Sigue registrando tus gastos para ver más consejos.']);
  const debts=T.cards.concat(T.loans).filter(a=>Number(a.balance)>0).sort((a,b)=>b.balance-a.balance);const dmax=Math.max(1,...debts.map(a=>+a.balance));
  const left=`
  <section class="card"><div style="font-weight:700;margin-bottom:4px">Entradas vs salidas</div><div class="muted small">Últimos 6 meses (salidas = gastos + pagos)</div>
  <div class="bars">${data.map(d=>`<div class="col"><div class="pair"><div class="b" style="height:${d.inc/max*100}%"></div><div class="b out" style="height:${d.out/max*100}%;animation-delay:.1s"></div></div><span>${monthName(d.k,false)}</span></div>`).join('')}</div>
  <div class="legend"><span><i></i>Entradas</span><span><i class="out"></i>Salidas</span></div></section>
  <section class="card"><div style="font-weight:700;margin-bottom:6px">Gastos de ${monthName(monthKey()).split(' ')[0]} por categoría</div>
  ${cats.length?cats.map(([c,v],k)=>`<div class="cat-row"><div class="nm">${ic(catIcon(c),15)} ${esc(c)}</div><div class="tr"><i style="width:${v/cmax*100}%;animation-delay:${k*.06}s"></i></div><div class="v">${M(v)}</div></div>`).join(''):'<div class="empty">Aún no hay gastos este mes.</div>'}
  ${now?`<div class="tip">${ic('chart',18)}<div>A este ritmo vas a gastar cerca de <b>${M(proj)}</b> este mes${prev?` (el mes pasado: ${M(prev)})`:''}.</div></div>`:''}</section>`;
  const right=`
  <section class="card"><div style="font-weight:700;margin-bottom:10px">Resumen</div><div class="stats">
    <div class="stat"><b>${M(T.debt)}</b><span>Deuda total</span></div>
    <div class="stat"><b>${M(T.monthly)}</b><span>Pagos al mes</span></div>
    <div class="stat"><b>${T.util!=null?Math.round(T.util*100)+'%':'—'}</b><span>Uso de crédito</span></div>
    <div class="stat"><b>${income?Math.round(T.monthly/income*100)+'%':'—'}</b><span>Ingreso a deudas</span></div></div></section>
  ${debts.length?`<section class="card"><div style="font-weight:700;margin-bottom:6px">¿A quién le debes más?</div>${debts.map((a,k)=>`<div class="cat-row"><div class="nm">${ic(a.kind==='card'?'card':'loan',15)} ${esc(a.name)}</div><div class="tr"><i style="width:${a.balance/dmax*100}%;animation-delay:${k*.06}s"></i></div><div class="v">${M(a.balance)}</div></div>`).join('')}</section>`:''}
  <div class="sec">Consejos de North</div>
  <section class="card"><div style="display:flex;justify-content:center;margin-bottom:4px">${coinSVG(80,'think')}</div>${tips.map(([i,c,t])=>`<div class="tip ${c}">${ic(i,18)}<div>${esc(t)}</div></div>`).join('')}</section>`;
  return topBar('Métricas')+`<div class="grid2"><div>${left}</div><div>${right}</div></div>`;
}

/* ====================== Ajustes ====================== */
function settingsView(){
  const st=pushState();
  const pushTxt={on:'Activadas en este dispositivo',off:'Toca para activarlas',install:'Primero instala North en tu pantalla de inicio',denied:'Bloqueadas en los ajustes del teléfono',unsupported:'Este navegador no las permite'}[st];
  return topBar('Ajustes')+`
  <section class="card" style="display:flex;align-items:center;gap:14px">${coinSVG(70,'happy')}<div><div style="font-weight:700;font-size:18px">${esc(user?.user_metadata?.name||userName())}</div><div class="muted small">${esc(user?.email||'')}</div></div></section>
  <section class="card list">
    <div class="li" onclick="openIncome()"><div class="ico">${ic('wallet',19)}</div><div class="mid"><div class="t">Ingreso mensual</div><div class="s">${settings.monthly_income?mxn(settings.monthly_income):'Sin definir'}</div></div>${ic('chevron',18)}</div>
    <div class="li" onclick="${st==='on'?'testPush(this)':'openNotifPrompt()'}"><div class="ico">${ic('bell',19)}</div><div class="mid"><div class="t">Notificaciones de pago</div><div class="s">${pushTxt}</div></div>${st==='on'?'<span class="pill ok">Probar</span>':ic('chevron',18)}</div>
    <div class="li" onclick="openRemind()"><div class="ico">${ic('calendar',19)}</div><div class="mid"><div class="t">¿Cuándo te aviso de tus pagos?</div><div class="s">${remindTxt()}</div></div>${ic('chevron',18)}</div>
    <label class="li"><div class="ico">${ic(soundOn()?'sound':'mute',19)}</div><div class="mid"><div class="t">Sonidos</div><div class="s">Clics y festejos al pagar</div></div><input type="checkbox" class="tgl" ${soundOn()?'checked':''} onchange="setSound(this.checked);render()"></label>
    <label class="li"><div class="ico">${ic('eyeOff',19)}</div><div class="mid"><div class="t">Ocultar montos</div><div class="s">Por si alguien ve tu pantalla</div></div><input type="checkbox" class="tgl" ${hideOn()?'checked':''} onchange="toggleHide()"></label>
    <div class="li" onclick="openName()"><div class="ico">${ic('user',19)}</div><div class="mid"><div class="t">Mi nombre</div></div>${ic('chevron',18)}</div>
    <div class="li" onclick="if(confirm('¿Cerrar sesión?'))logout()" style="color:var(--danger)"><div class="ico" style="color:var(--danger)">${ic('logout',19)}</div><div class="mid"><div class="t">Cerrar sesión</div></div></div>
  </section>
  <div class="muted small" style="text-align:center;line-height:1.5;margin:10px 20px">North no se conecta a tu banco: tú anotas los datos. Tu información es privada y solo tú la ves con tu cuenta.<br>North es una herramienta de organización, no asesoría financiera.</div>`;
}
function openIncome(){
  openSheet(head('Ingreso mensual','Lo que te entra al mes, más o menos. Sirve para tus métricas.')+`<div class="field"><input id="incAmt" class="amount-in" inputmode="decimal" value="${settings.monthly_income||''}" placeholder="$0"></div><button class="btn" onclick="saveIncome(this)">${ic('check',18)} Guardar</button>`);
  setTimeout(()=>$('incAmt')?.focus(),250);
}
async function saveIncome(btn){btn.disabled=true;try{await saveSettings({monthly_income:num($('incAmt').value)});sfx('ok');closeSheet();render();toast('Guardado')}catch(e){btn.disabled=false;alert('No se pudo guardar: '+(e.message||e))}}

function askName(){openSheet(head('¿Cómo te llamas?','Para saludarte por tu nombre y no por tu correo.')+`<div style="display:flex;justify-content:center">${coinSVG(110,'wave')}</div><div class="field"><input id="nmIn" placeholder="Tu nombre" autocomplete="given-name"></div><button class="btn" onclick="saveName(this)">${ic('check',18)} Guardar</button>`);setTimeout(()=>$('nmIn')?.focus(),300)}
function openName(){openSheet(head('Mi nombre')+`<div class="field"><input id="nmIn" value="${esc(user?.user_metadata?.name||'')}" placeholder="Tu nombre"></div><button class="btn" onclick="saveName(this)">${ic('check',18)} Guardar</button>`)}
async function saveName(btn){const nm=$('nmIn').value.trim();if(!nm){toast('Escribe tu nombre','think');return}btn.disabled=true;const {data,error}=await sb.auth.updateUser({data:{name:nm}});if(error){btn.disabled=false;return alert(error.message)}user=data.user;sfx('ok');closeSheet();render();toast('¡Mucho gusto, '+userName()+'!')}


/* ---- días de aviso antes del pago ---- */
const DEF_DAYS=[14,8,2,0];
function remindDays(){return (Array.isArray(settings.remind_days)&&settings.remind_days.length?settings.remind_days:DEF_DAYS).slice().sort((a,b)=>b-a)}
function remindTxt(){const d=remindDays();const parts=d.map(n=>n===0?'el mismo día':n===1?'1 día antes':n+' días antes');return parts.length>1?parts.slice(0,-1).join(', ')+' y '+parts.slice(-1):parts[0]}
function openRemind(){
  const cur=new Set(remindDays());
  openSheet(head('¿Cuándo te aviso?','Antes de tu fecha límite de pago. Elige todos los que quieras.')+`
  <div class="chips">${[21,15,14,10,8,7,5,3,2,1,0].map(n=>`<button class="chipb ${cur.has(n)?'on':''}" data-rd="${n}" onclick="this.classList.toggle('on');sfx('toggle');rdPreview()">${n===0?'El mismo día':n===1?'1 día antes':n+' días antes'}</button>`).join('')}</div>
  <div class="tip" id="rdPrev"></div>
  <button class="btn" style="margin-top:14px" onclick="saveRemind(this)">${ic('check',18)} Guardar</button>`);
  rdPreview();
}
function rdPreview(){
  const days=[...document.querySelectorAll('[data-rd].on')].map(b=>+b.dataset.rd).sort((a,b)=>b-a);const el=$('rdPrev');if(!el)return;
  if(!days.length){el.innerHTML=ic('alert',18)+'<div>Elige al menos uno.</div>';return}
  const ex=days.map(n=>n===0?'27':String(27-n)).join(', ');
  el.innerHTML=ic('bell',18)+`<div>Ejemplo: si pagas el <b>27</b>, te aviso los días <b>${ex}</b>. También te aviso en tu fecha de corte.</div>`;
}
async function saveRemind(btn){
  const days=[...document.querySelectorAll('[data-rd].on')].map(b=>+b.dataset.rd);if(!days.length)return toast('Elige al menos uno','think');
  btn.disabled=true;try{await saveSettings({remind_days:days.sort((a,b)=>b-a)});sfx('ok');closeSheet();render();toast('¡Listo! Así te aviso')}catch(e){btn.disabled=false;alert('No se pudo guardar: '+(e.message||e))}
}

/* ====================== notificaciones ====================== */
function pushState(){
  if(!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window)){
    const ios=/iphone|ipad|ipod/i.test(navigator.userAgent),standalone=navigator.standalone||matchMedia('(display-mode: standalone)').matches;
    return ios&&!standalone?'install':'unsupported';
  }
  if(Notification.permission==='denied')return 'denied';
  return Notification.permission==='granted'&&ls('lana_push')==='on'?'on':'off';
}
function openNotifPrompt(afterId){
  const st=pushState();
  const body={install:'En iPhone: abre North en Safari, toca Compartir y luego "Agregar a pantalla de inicio". Abre North desde ese ícono y activa los avisos en Ajustes.',unsupported:'Abre North desde el ícono instalado en tu teléfono para recibir avisos.',denied:'Las notificaciones están bloqueadas. Actívalas en Ajustes del teléfono › Notificaciones › North.',on:'Ya están activadas en este dispositivo.'}[st];
  openSheet(head('¿Te aviso antes de pagar?')+`<div style="display:flex;justify-content:center">${coinSVG(120,'wave')}</div><p style="text-align:center;color:var(--ink2);line-height:1.5">Te mando una notificación ${remindTxt()} de tu fecha límite, y en tu fecha de corte. Así nunca pagas intereses por olvido.</p>
  ${body?`<div class="tip">${ic('bulb',18)}<div>${body}</div></div>`:`<button class="btn" onclick="enablePush(this,'${afterId||''}')">${ic('bell',18)} Sí, avísame</button>`}
  <button class="btn alt" onclick="${afterId?`openDetail('${afterId}')`:'closeSheet()'}">Ahora no</button>`);
}
function b64ToU8(b){const p='='.repeat((4-b.length%4)%4),s=atob((b+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from([...s].map(c=>c.charCodeAt(0)))}
async function enablePush(btn,afterId){
  try{
    if(btn)btn.disabled=true;
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){toast('Sin permiso no te puedo avisar','think');if(btn)btn.disabled=false;return}
    const reg=await navigator.serviceWorker.ready;
    const {publicKey}=await (await fetch(PUSH_API+'/api/vapid')).json();
    let sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToU8(publicKey)});
    const j=sub.toJSON();
    const {error}=await sb.from('rt_push_subs').upsert({user_id:user.id,app:'lana',endpoint:j.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth,tz:Intl.DateTimeFormat().resolvedOptions().timeZone},{onConflict:'endpoint'});
    if(error)throw error;
    ls('lana_push','on');sfx('ok');render();
    if(afterId)openDetail(afterId);else closeSheet();toast('¡Avisos activados!','celebrate');
  }catch(e){console.error(e);if(btn)btn.disabled=false;alert('No se pudieron activar: '+(e.message||e))}
}
async function testPush(el){
  try{const {data:{session}}=await sb.auth.getSession();
    const r=await fetch(PUSH_API+'/api/test-push',{method:'POST',headers:{Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},body:JSON.stringify({app:'lana'})});const j=await r.json().catch(()=>({}));
    toast(r.ok?'Enviada, revisa tus notificaciones':'No se pudo: '+(j.error||r.status),r.ok?'happy':'think');
  }catch(e){toast('No se pudo enviar','think')}
}

/* ====================== cuenta ====================== */
function showSignup(on){$('loginCard').style.display=on?'none':'block';$('signupCard').style.display=on?'block':'none';
  $('authSub').innerHTML=on?'<b>¡Qué gusto!</b>Crea tu cuenta y en un minuto ordenamos tu lana.':'<b>Tu lana, bajo control.</b>Tarjetas, pagos y gastos en un solo lugar, y te aviso antes de cada fecha de pago.'}
function authErr(id,msg){const e=$(id);e.textContent=msg;e.style.display='block';sfx('undo')}
async function login(){
  const email=$('lEmail').value.trim(),password=$('lPass').value;if(!email||!password)return authErr('loginErr','Escribe tu correo y contraseña.');
  $('lBtn').disabled=true;const {data,error}=await sb.auth.signInWithPassword({email,password});$('lBtn').disabled=false;
  if(error)return authErr('loginErr',error.message==='Invalid login credentials'?'Correo o contraseña incorrectos.':error.message.includes('confirm')?'Primero confirma tu correo (revisa tu bandeja).':error.message);
  sfx('celebrate');await start(data.user);
}
async function signup(){
  const name=$('sName').value.trim(),email=$('sEmail').value.trim(),password=$('sPass').value;
  if(!name)return authErr('signupErr','Escribe tu nombre.');if(!email.includes('@'))return authErr('signupErr','Escribe un correo válido.');if(password.length<6)return authErr('signupErr','La contraseña debe tener al menos 6 caracteres.');
  $('sBtn').disabled=true;const {data,error}=await sb.auth.signUp({email,password,options:{data:{name},emailRedirectTo:location.origin}});$('sBtn').disabled=false;
  if(error)return authErr('signupErr',error.message.includes('registered')?'Ese correo ya tiene cuenta. Inicia sesión (sirve la misma de Nutri y Ritmo).':error.message);
  if(!data.session){showSignup(false);authErr('loginErr','Te mandamos un correo de confirmación. Ábrelo y luego inicia sesión aquí.');return}
  sfx('celebrate');await start(data.user);
}
async function logout(){await sb.auth.signOut();user=null;accounts=[];moves=[];closeSheet();$('auth').classList.add('open')}

/* ====================== arranque ====================== */
function hideSplash(){const s=$('splash');if(s&&!s.classList.contains('hide')){s.classList.add('hide');setTimeout(()=>s.remove(),400)}}
async function start(u){
  user=u;$('auth').classList.remove('open');
  try{await loadData()}catch(e){console.error(e);$('main').innerHTML=`<section class="card empty" style="margin-top:40px"><div class="mas">${coinSVG(100,'think')}</div><b>No pude cargar tus datos</b><br>Revisa tu internet e intenta de nuevo.<div style="margin-top:14px"><button class="btn" onclick="location.reload()">Reintentar</button></div></section>`;hideSplash();return}
  buildNav();render();hideSplash();
  if(!user.user_metadata?.name)setTimeout(()=>askName(),700);
}
(async function boot(){
  $('splashLogo').innerHTML=coinSVG(130,'wave');$('authLogo').innerHTML=coinSVG(130,'wave');
  if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(e=>console.warn(e));
  setTimeout(hideSplash,6000);
  const {data:{session}}=await sb.auth.getSession();
  if(session)await start(session.user);else{$('auth').classList.add('open');hideSplash()}
})();
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
</script>
<script src="galaxy.js"></script>
</body>
